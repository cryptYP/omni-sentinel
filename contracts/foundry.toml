[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.19"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
tenderly = "${TENDERLY_VIRTUAL_TESTNET_RPC}"

[etherscan]
tenderly = { key = "${TENDERLY_ACCESS_KEY}", chain = 73571, url = "${TENDERLY_EXPLORER_URL}" }
